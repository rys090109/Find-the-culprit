<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>로그인</title>
    <link rel="stylesheet" href="../css/login.css" />
  </head>

  <body>
    <a class="back-link" href="./start.html" aria-label="시작 화면으로 돌아가기"
      >&larr;</a
    >
    <h1 id="logo">MYSTERYGAME</h1>

    <main class="login-card">
      <h1>로그인</h1>

      <form id="login-form">
        <input
          id="username"
          type="text"
          name="username"
          placeholder="아이디"
          aria-label="아이디"
        />

        <input
          id="password"
          type="password"
          name="password"
          placeholder="비밀번호"
          aria-label="비밀번호"
        />

        <button type="submit">로그인</button>
      </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabaseClient.js"></script>
    <script src="../js/login.js"></script>
  </body>
</html>
